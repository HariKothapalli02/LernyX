<!-- Chat Styles Override for this page -->
<style>
    .app-wrapper {
        background: transparent;
    }

    .chat-header {
        height: 70px;
        backdrop-filter: blur(10px);
    }

    .chat-box {
        background: rgba(0, 0, 0, 0.2);
    }

    .chat-message {
        margin-bottom: 1.25rem;
        max-width: 85%;
        padding: 1rem 1.25rem;
        border-radius: 1.25rem;
        position: relative;
        animation: fadeIn 0.3s ease;
        line-height: 1.6;
    }

    .chat-message.user {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        color: white;
        margin-left: auto;
        border-bottom-right-radius: 0.25rem;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
    }

    .chat-message.bot {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: var(--text-primary);
        margin-right: auto;
        border-bottom-left-radius: 0.25rem;
    }

    .chat-message p:last-child {
        margin-bottom: 0;
    }

    .chat-input-area {
        backdrop-filter: blur(10px);
    }

    .history-item {
        transition: all 0.2s ease;
        border: 1px solid transparent;
    }

    .history-item:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.1);
    }

    .history-item.active {
        background: rgba(99, 102, 241, 0.15);
        border-color: rgba(99, 102, 241, 0.3);
    }

    @media (max-width: 768px) {
        .chat-main-col {
            padding: 0 !important;
        }

        .chat-header {
            height: 60px;
        }

        .chat-message {
            max-width: 92%;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
        }

        .welcome-screen h3 {
            font-size: 1.5rem;
        }

        .welcome-screen p {
            font-size: 0.9rem;
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<script>
    window.MathJax = {
        loadHistory();
        document.getElementById("message").addEventListener("keypress", (e) => {
            if (e.key === "Enter") send();
        });
    });

    function startNewChat() {
        currentChatId = null;
        document.getElementById('chat').innerHTML = `
            <div class="text-center mt-5 fade-in-up welcome-screen">
                <div class="mb-3"><i class="bi bi-stars text-warning display-4"></i></div>
                <h3 class="text-white fw-bold">How can I help you today?</h3>
                <p class="text-secondary px-3">Ask me about code, debugging, or complex concepts.</p>
            </div>`;
        loadHistory();
    }

    async function loadHistory() {
        const historyList = document.getElementById('history-list');
        const historyListMobile = document.getElementById('history-list-mobile');

        try {
            const response = await fetch('/api/user-chats');
            const data = await response.json();
            const chats = data.conversations || [];

            const renderChats = (container) => {
                container.innerHTML = '';
                if (chats.length === 0) {
                    container.innerHTML = '<p class="text-center text-secondary small mt-3">No recent chats</p>';
                    return;
                }

                chats.forEach(chat => {
                    const div = document.createElement('div');
                    const isActive = chat._id === currentChatId;
                    div.className = `p-3 mb-2 rounded history-item cursor-pointer ${isActive ? 'active' : ''}`;
                    div.innerHTML = `
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-chat-left-text text-primary"></i>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="text-truncate small text-white fw-medium">${chat.title || 'Untitled Chat'}</div>
                                <div class="text-secondary" style="font-size: 0.7rem;">${new Date(chat.timestamp).toLocaleDateString()}</div>
                            </div>
                        </div>
                    `;
                    div.onclick = () => {
                        loadChat(chat._id);
                        // Close offcanvas on mobile
                        const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('historySidebar'));
                        if (offcanvas) offcanvas.hide();
                    };
                    container.appendChild(div);
                });
            };

            renderChats(historyList);
            renderChats(historyListMobile);
        } catch (error) {
            console.error('Error loading history:', error);
        }
    }

    async function loadChat(chatId) {
        currentChatId = chatId;
        const chatBox = document.getElementById('chat');
        chatBox.innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary" role="status"></div></div>';

        try {
            const response = await fetch(`/api/get_chat/${chatId}`);
            const data = await response.json();
            chatBox.innerHTML = '';
            data.messages.forEach(msg => {
                appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
            });
            loadHistory();
        } catch (error) {
            console.error('Error loading chat:', error);
        }
    }

    let selectedFile = null;
    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            selectedFile = input.files[0];
            document.getElementById('file-name').textContent = selectedFile.name;
            document.getElementById('file-preview').classList.remove('d-none');
        }
    }

    function clearFile() {
        selectedFile = null;
        document.getElementById('file-input').value = '';
        document.getElementById('file-preview').classList.add('d-none');
    }

    async function send() {
        const messageInput = document.getElementById('message');
        const message = messageInput.value.trim();
        if (!message && !selectedFile) return;

        appendMessage('user', message);
        messageInput.value = '';
        const chatBox = document.getElementById('chat');

        const loadingId = 'loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.id = loadingId;
        loadingDiv.className = 'chat-message bot';
        loadingDiv.innerHTML = '<div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Thinking...';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        const formData = new FormData();
        formData.append('message', message);
        if (selectedFile) formData.append('file', selectedFile);
        if (currentChatId) formData.append('chat_id', currentChatId);

        try {
            const response = await fetch('/api/chat', { method: 'POST', body: formData });
            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.error) {
                appendMessage('bot', 'Error: ' + data.error);
            } else {
                appendMessage('bot', data.response);
                if (data.conversation_id) {
                    currentChatId = data.conversation_id;
                    loadHistory();
                }
            }
            clearFile();
        } catch (error) {
            if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
            appendMessage('bot', 'Error: Could not connect to server.');
        }
    }

    function appendMessage(sender, text) {
        const chatBox = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `chat-message ${sender}`;

        if (sender === 'bot') {
            div.innerHTML = marked.parse(text);
        } else {
            div.textContent = text;
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (window.MathJax) {
            MathJax.typesetPromise([div]).catch((err) => console.log(err));
        }
    }
</script>
{% endblock %}
