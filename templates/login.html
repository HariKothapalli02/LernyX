{% extends "base.html" %}

{% block title %}Login - LernyX{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="glass-card fade-in-up">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white">Welcome Back</h2>
                    <p class="text-secondary">Login to continue your journey</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label text-white">Username or Email</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Enter username or email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-white">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-secondary small">
                        Don't have an account? <a href="{{ url_for('signup') }}"
                            class="text-white fw-bold text-decoration-none">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
