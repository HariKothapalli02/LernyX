{% extends "base.html" %}

{% block title %}Sign Up - LernyX{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="row w-100 justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="glass-card fade-in-up">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white">Create Account</h2>
                    <p class="text-secondary">Join thousands of learners today</p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label text-white">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-white">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-white">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Create a password" required minlength="6">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label text-white">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            placeholder="Confirm password" required minlength="6">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-secondary small">
                        Already have an account? <a href="{{ url_for('login') }}"
                            class="text-white fw-bold text-decoration-none">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
