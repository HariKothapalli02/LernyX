{% extends "base.html" %}

{% block title %}Sign Up - LernyX{% endblock %}

{% block content %}
<style>
    /* Hide Navbar and Footer for this page to achieve full-screen look */
    .navbar,
    footer,
    #canvas-container {
        display: none !important;
    }

    body {
        min-height: 100vh;
        overflow-y: auto !important;
        background: var(--bg-deep);
    }

    .split-screen {
        min-height: 100vh;
        width: 100vw;
        overflow-y: auto;
    }

    .left-pane {
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem;
        position: relative;
        border-right: 1px solid rgba(255, 255, 255, 0.2);
        min-height: 100vh;
    }

    .auth-illustration-img {
        max-width: 80%;
        max-height: 75vh;
        object-fit: contain;
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.15));
    }

    .right-pane {
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2.5rem 1.5rem;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        overflow-y: auto;
    }

    .login-container {
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    .custom-input {
        background: #000000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 0px !important;
        color: #ffffff;
        padding: 0.8rem 1rem;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .custom-input:focus {
        background: #080808;
        border-color: #ffffff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
        color: #ffffff;
    }

    .custom-input::placeholder {
        color: #737373;
    }

    .btn-login {
        background: #ffffff !important;
        color: #000000 !important;
        border: 1px solid #ffffff !important;
        border-radius: 0px !important;
        padding: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
        margin-top: 1rem;
    }

    .btn-login:hover {
        background: #000000 !important;
        color: #ffffff !important;
        box-shadow: 3px 3px 0px #ffffff;
    }

    /* Mobile adjustments */
    @media (max-width: 992px) {
        .left-pane {
            display: none !important;
        }

        .right-pane {
            width: 100%;
            border-left: none;
        }
    }
</style>

<div class="container-fluid p-0 split-screen">
    <div class="row g-0 h-100">
        <!-- Left Side: Image -->
        <div class="col-lg-7 left-pane d-none d-lg-flex">
            <img src="{{ url_for('static', filename='img/signup-bro.png') }}" alt="LernyX Sign Up Illustration" class="auth-illustration-img">
        </div>

        <!-- Right Side: Form -->
        <div class="col-lg-5 col-md-12 right-pane">
            <div class="login-container fade-in-up">
                <!-- Mobile-Only Illustration Image Above Title & Text Fields -->
                <div class="mobile-auth-illustration d-lg-none text-center mb-3">
                    <img src="{{ url_for('static', filename='img/signup-bro.png') }}" alt="Sign Up Illustration" class="img-fluid" style="max-height: 160px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.18));">
                </div>

                <h1 class="fw-bold text-white mb-4 display-5">Create Account</h1>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <input type="text" class="form-control custom-input" id="username" name="username"
                            placeholder="Username" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control custom-input" id="email" name="email"
                            placeholder="Email" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control custom-input" id="password" name="password"
                            placeholder="Password" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control custom-input" id="confirm_password"
                            name="confirm_password" placeholder="Confirm Password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-login">
                        Sign Up
                    </button>
                </form>

                <div class="mt-4">
                    <p class="text-secondary small">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
