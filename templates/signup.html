{% extends "base.html" %}

{% block title %}Sign Up - LernyX{% endblock %}

{% block content %}
<style>
    /* Hide Navbar and Footer for this page to achieve full-screen look */
    .navbar,
    footer,
    #canvas-container {
        display: none !important;
    }

    body {
        overflow: hidden;
        /* Prevent scrolling */
        background: var(--bg-deep);
        /* Use global theme background */
    }

    .split-screen {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }

    .left-pane {
        background: url("{{ url_for('static', filename='img/hero-illustration.png') }}") no-repeat center center;
        background-size: cover;
        position: relative;
    }

    .left-pane::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
    }

    .right-pane {
        /* Use global theme background with slight transparency for depth */
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        position: relative;
        z-index: 1;
        border-left: 1px solid var(--glass-border);
    }

    .login-container {
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    .custom-input {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        color: var(--text-primary);
        padding: 0.8rem 1rem;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .custom-input:focus {
        background: var(--glass-bg-hover);
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        color: white;
    }

    .custom-input::placeholder {
        color: var(--text-secondary);
    }

    .btn-login {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border: none;
        padding: 0.8rem;
        border-radius: 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        margin-top: 1rem;
        color: white;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    /* Mobile adjustments */
    @media (max-width: 992px) {
        .left-pane {
            display: none;
        }

        .right-pane {
            width: 100%;
            border-left: none;
        }
    }
</style>

<div class="container-fluid p-0 split-screen">
    <div class="row g-0 h-100">
        <!-- Left Side: Image -->
        <div class="col-lg-7 left-pane d-none d-lg-block">
            <!-- Image is set via CSS background -->
        </div>

        <!-- Right Side: Form -->
        <div class="col-lg-5 col-md-12 right-pane">
            <div class="login-container fade-in-up">
                <h1 class="fw-bold text-white mb-4 display-5">Create Account</h1>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <input type="text" class="form-control custom-input" id="username" name="username"
                            placeholder="Username" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control custom-input" id="email" name="email"
                            placeholder="Email" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control custom-input" id="password" name="password"
                            placeholder="Password" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control custom-input" id="confirm_password"
                            name="confirm_password" placeholder="Confirm Password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-login">
                        Sign Up
                    </button>
                </form>

                <div class="mt-4">
                    <p class="text-secondary small">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
