{% extends "base.html" %}

{% block title %}Create Account - LernyX{% endblock %}

{% block content %}
<style>
    /* Full-screen auth layout */
    .navbar,
    footer,
    #canvas-container {
        display: none !important;
    }

    body {
        min-height: 100vh;
        overflow-y: auto !important;
        background: #ffffff;
    }

    .split-screen {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
    }

    .split-screen > .row {
        width: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
    }

    .left-pane {
        background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        position: relative;
        border-right: 1px solid var(--border-subtle);
        min-height: 100vh;
    }

    .auth-illustration-img {
        max-width: 80%;
        max-height: 75vh;
        object-fit: contain;
        filter: drop-shadow(0 15px 35px rgba(124, 58, 237, 0.18));
    }

    .right-pane {
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 3rem 2.5rem;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        overflow-y: auto;
    }

    .login-container {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
    }

    .custom-input {
        background: #ffffff !important;
        border: 1.5px solid var(--border-slate-dark) !important;
        border-radius: var(--radius-sm) !important;
        color: var(--text-heading) !important;
        padding: 0.75rem 1.1rem;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .custom-input:focus {
        background: #ffffff !important;
        border-color: var(--primary-purple) !important;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2) !important;
        color: var(--text-heading) !important;
    }

    .custom-input::placeholder {
        color: var(--text-subtle) !important;
    }

    .btn-login {
        background: var(--primary-gradient) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: var(--radius-sm) !important;
        padding: 0.85rem;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-purple-btn);
        margin-top: 1rem;
    }

    .btn-login:hover {
        background: var(--primary-gradient-hover) !important;
        color: #ffffff !important;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    @media (max-width: 991.98px) {
        .left-pane {
            display: none !important;
        }

        .right-pane {
            width: 100%;
            padding: 2.5rem 1.5rem;
        }
    }
</style>

<div class="container-fluid p-0 split-screen">
    <div class="row g-0 h-100">
        <!-- Left Side: Image -->
        <div class="col-lg-6 left-pane d-none d-lg-flex">
            <img src="{{ url_for('static', filename='img/signup-bro.png') }}" alt="LernyX Sign Up Illustration" class="auth-illustration-img">
        </div>

        <!-- Right Side: Form (Centered in 50% Pane) -->
        <div class="col-lg-6 col-12 right-pane">
            <div class="login-container fade-in-up">
                <!-- Mobile-Only Illustration Image -->
                <div class="mobile-auth-illustration d-lg-none text-center mb-3">
                    <img src="{{ url_for('static', filename='img/signup-bro.png') }}" alt="Sign Up Illustration" class="img-fluid" style="max-height: 150px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(124, 58, 237, 0.15));">
                </div>

                <!-- Brand & Heading Centered -->
                <div class="text-center mb-4">
                    <a href="{{ url_for('home') }}" class="text-decoration-none d-inline-flex align-items-center mb-3">
                        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="LernyX" class="brand-logo-img me-2" width="36" height="36">
                        <span class="brand-title" style="font-size: 1.65rem;">Lerny<span class="brand-x">X</span></span>
                    </a>
                    <h1 class="fw-bold text-dark mb-1 h2 tracking-tight">Create Account</h1>
                    <p class="text-secondary small mb-0">Join LernyX to accelerate your coding and interview mastery.</p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label text-dark fw-semibold small">Username</label>
                        <input type="text" class="form-control custom-input" id="username" name="username"
                            placeholder="e.g., johndoe" required autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-dark fw-semibold small">Email Address</label>
                        <input type="email" class="form-control custom-input" id="email" name="email"
                            placeholder="e.g., name@domain.com" required autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-dark fw-semibold small">Password</label>
                        <input type="password" class="form-control custom-input" id="password" name="password"
                            placeholder="At least 6 characters" required autocomplete="new-password">
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label text-dark fw-semibold small">Confirm Password</label>
                        <input type="password" class="form-control custom-input" id="confirm_password"
                            name="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-login">
                        Create Account <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-secondary small mb-0">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold ms-1">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
