{% extends "base.html" %}

{% block title %}Sign Up - LernyX{% endblock %}

{% block head %}
<style>
    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .fade-in-up {
        opacity: 0;
        transform: translateY(30px);
        animation: fadeInUp 0.8s ease forwards;
    }

    body {
        background: #000;
        overflow-x: hidden;
    }
</style>
{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 3rem 1rem;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-8 col-lg-5" style="max-width: 500px;">
            <div class="glass-card fade-in-up"
                style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 3rem 2.5rem; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);">
                <div class="text-center mb-4" style="margin-bottom: 2rem;">
                    <h2 class="fw-bold text-white"
                        style="font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 900; color: #fff; margin-bottom: 0.75rem; letter-spacing: -0.02em;">
                        Create Account</h2>
                    <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.95rem; margin: 0;">Join thousands of
                        learners today</p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3" style="margin-bottom: 1.25rem;">
                        <label for="username" class="form-label text-white"
                            style="display: block; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.9); font-size: 0.9rem; font-weight: 600;">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Choose a username" required
                            style="width: 100%; padding: 0.875rem 1.25rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 0.95rem; transition: all 0.3s ease; outline: none;"
                            onfocus="this.style.background='rgba(255, 255, 255, 0.12)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'; this.style.boxShadow='0 0 0 3px rgba(255, 255, 255, 0.05)';"
                            onblur="this.style.background='rgba(255, 255, 255, 0.08)'; this.style.borderColor='rgba(255, 255, 255, 0.15)'; this.style.boxShadow='none';">
                    </div>
                    <div class="mb-3" style="margin-bottom: 1.25rem;">
                        <label for="email" class="form-label text-white"
                            style="display: block; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.9); font-size: 0.9rem; font-weight: 600;">Email
                            Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com"
                            required
                            style="width: 100%; padding: 0.875rem 1.25rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 0.95rem; transition: all 0.3s ease; outline: none;"
                            onfocus="this.style.background='rgba(255, 255, 255, 0.12)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'; this.style.boxShadow='0 0 0 3px rgba(255, 255, 255, 0.05)';"
                            onblur="this.style.background='rgba(255, 255, 255, 0.08)'; this.style.borderColor='rgba(255, 255, 255, 0.15)'; this.style.boxShadow='none';">
                    </div>
                    <div class="mb-3" style="margin-bottom: 1.25rem;">
                        <label for="password" class="form-label text-white"
                            style="display: block; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.9); font-size: 0.9rem; font-weight: 600;">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Create a password" required minlength="6"
                            style="width: 100%; padding: 0.875rem 1.25rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 0.95rem; transition: all 0.3s ease; outline: none;"
                            onfocus="this.style.background='rgba(255, 255, 255, 0.12)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'; this.style.boxShadow='0 0 0 3px rgba(255, 255, 255, 0.05)';"
                            onblur="this.style.background='rgba(255, 255, 255, 0.08)'; this.style.borderColor='rgba(255, 255, 255, 0.15)'; this.style.boxShadow='none';">
                    </div>
                    <div class="mb-4" style="margin-bottom: 2rem;">
                        <label for="confirm_password" class="form-label text-white"
                            style="display: block; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.9); font-size: 0.9rem; font-weight: 600;">Confirm
                            Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            placeholder="Confirm password" required minlength="6"
                            style="width: 100%; padding: 0.875rem 1.25rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 0.95rem; transition: all 0.3s ease; outline: none;"
                            onfocus="this.style.background='rgba(255, 255, 255, 0.12)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'; this.style.boxShadow='0 0 0 3px rgba(255, 255, 255, 0.05)';"
                            onblur="this.style.background='rgba(255, 255, 255, 0.08)'; this.style.borderColor='rgba(255, 255, 255, 0.15)'; this.style.boxShadow='none';">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg"
                            style="width: 100%; padding: 1rem 2rem; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 12px; color: #fff; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; outline: none;"
                            onmouseover="this.style.background='rgba(255, 255, 255, 0.25)'; this.style.borderColor='rgba(255, 255, 255, 0.4)'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 30px rgba(255, 255, 255, 0.15)';"
                            onmouseout="this.style.background='rgba(255, 255, 255, 0.15)'; this.style.borderColor='rgba(255, 255, 255, 0.25)'; this.style.transform='translateY(0)'; this.style.boxShadow='none';"
                            onmousedown="this.style.transform='translateY(0) scale(0.98)';"
                            onmouseup="this.style.transform='translateY(-2px) scale(1)';">
                            Sign Up
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4" style="margin-top: 2rem; text-align: center;">
                    <p style="color: rgba(255, 255, 255, 0.5); font-size: 0.9rem; margin: 0;">
                        Already have an account? <a href="{{ url_for('login') }}"
                            style="color: #fff; font-weight: 700; text-decoration: none; transition: all 0.2s ease;"
                            onmouseover="this.style.color='rgba(255, 255, 255, 0.8)'; this.style.textDecoration='underline';"
                            onmouseout="this.style.color='#fff'; this.style.textDecoration='none';">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Mobile responsive adjustments
    function handleSignupResize() {
        const isMobile = window.innerWidth <= 768;
        const glassCard = document.querySelector('.glass-card');

        if (isMobile && glassCard) {
            glassCard.style.padding = '2rem 1.5rem';
        } else if (glassCard) {
            glassCard.style.padding = '3rem 2.5rem';
        }
    }

    window.addEventListener('resize', handleSignupResize);
    handleSignupResize();

    // Password matching validation
    const form = document.querySelector('form');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');

    form.addEventListener('submit', function (e) {
        if (password.value !== confirmPassword.value) {
            e.preventDefault();

            // Show error styling
            confirmPassword.style.borderColor = 'rgba(255, 100, 100, 0.5)';
            confirmPassword.style.background = 'rgba(255, 100, 100, 0.1)';

            // Create or update error message
            let errorMsg = document.getElementById('password-error');
            if (!errorMsg) {
                errorMsg = document.createElement('div');
                errorMsg.id = 'password-error';
                errorMsg.style.cssText = 'color: rgba(255, 100, 100, 0.9); font-size: 0.85rem; margin-top: 0.5rem; font-weight: 500;';
                confirmPassword.parentElement.appendChild(errorMsg);
            }
            errorMsg.textContent = 'Passwords do not match';

            // Reset error after user starts typing
            confirmPassword.addEventListener('input', function () {
                this.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                this.style.background = 'rgba(255, 255, 255, 0.08)';
                if (errorMsg) errorMsg.remove();
            }, { once: true });
        }
    });

    // Real-time password strength indicator
    password.addEventListener('input', function () {
        const strength = this.value.length;
        let strengthText = '';
        let strengthColor = '';

        if (strength === 0) {
            strengthText = '';
        } else if (strength < 6) {
            strengthText = 'Too short';
            strengthColor = 'rgba(255, 100, 100, 0.9)';
        } else if (strength < 8) {
            strengthText = 'Weak';
            strengthColor = 'rgba(255, 200, 100, 0.9)';
        } else if (strength < 12) {
            strengthText = 'Good';
            strengthColor = 'rgba(100, 200, 255, 0.9)';
        } else {
            strengthText = 'Strong';
            strengthColor = 'rgba(100, 255, 150, 0.9)';
        }

        let strengthIndicator = document.getElementById('strength-indicator');
        if (!strengthIndicator && strengthText) {
            strengthIndicator = document.createElement('div');
            strengthIndicator.id = 'strength-indicator';
            strengthIndicator.style.cssText = 'font-size: 0.85rem; margin-top: 0.5rem; font-weight: 500; transition: all 0.3s ease;';
            password.parentElement.appendChild(strengthIndicator);
        }

        if (strengthIndicator) {
            if (strengthText) {
                strengthIndicator.textContent = `Password strength: ${strengthText}`;
                strengthIndicator.style.color = strengthColor;
            } else {
                strengthIndicator.remove();
            }
        }
    });
</script>
{% endblock %}
