{% extends "base.html" %}

{% block title %}Verify Email - LernyX{% endblock %}

{% block content %}
<style>
    /* Full-screen auth layout */
    .navbar,
    footer,
    #canvas-container {
        display: none !important;
    }

    body {
        min-height: 100vh;
        overflow-y: auto !important;
        background: #ffffff;
    }

    .split-screen {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
    }

    .split-screen > .row {
        width: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
    }

    .left-pane {
        background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        position: relative;
        border-right: 1px solid var(--border-subtle);
        min-height: 100vh;
    }

    .auth-illustration-img {
        max-width: 80%;
        max-height: 75vh;
        object-fit: contain;
        filter: drop-shadow(0 15px 35px rgba(124, 58, 237, 0.18));
    }

    .right-pane {
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 3rem 2.5rem;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        overflow-y: auto;
    }

    .login-container {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
    }

    .otp-input {
        background: #ffffff !important;
        border: 2px solid var(--border-slate-dark) !important;
        border-radius: var(--radius-md) !important;
        color: var(--primary-purple) !important;
        padding: 0.85rem 1rem;
        font-size: 2rem;
        letter-spacing: 0.35em;
        text-align: center;
        font-family: var(--font-mono);
        transition: all 0.2s ease;
        font-weight: 700;
        box-shadow: var(--shadow-sm);
    }

    .otp-input:focus {
        background: #ffffff !important;
        border-color: var(--primary-purple) !important;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2) !important;
        color: var(--primary-purple) !important;
    }

    .btn-action {
        background: var(--primary-gradient) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: var(--radius-sm) !important;
        padding: 0.85rem;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-purple-btn);
        margin-top: 1rem;
    }

    .btn-action:hover {
        background: var(--primary-gradient-hover) !important;
        color: #ffffff !important;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    @media (max-width: 991.98px) {
        .left-pane {
            display: none !important;
        }

        .right-pane {
            width: 100%;
            padding: 2.5rem 1.5rem;
        }
    }
</style>

<div class="container-fluid p-0 split-screen">
    <div class="row g-0 h-100">
        <!-- Left Side: Illustration -->
        <div class="col-lg-6 left-pane d-none d-lg-flex">
            <img src="{{ url_for('static', filename='img/enter-otp-bro.png') }}" alt="Verify Signup OTP Illustration" class="auth-illustration-img">
        </div>

        <!-- Right Side: Form (Centered in 50% Pane) -->
        <div class="col-lg-6 col-12 right-pane">
            <div class="login-container fade-in-up">
                <!-- Mobile-Only Illustration Image -->
                <div class="mobile-auth-illustration d-lg-none text-center mb-3">
                    <img src="{{ url_for('static', filename='img/enter-otp-bro.png') }}" alt="Verify Signup OTP Illustration" class="img-fluid" style="max-height: 160px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(124, 58, 237, 0.15));">
                </div>

                <!-- Brand & Heading Centered -->
                <div class="text-center mb-4">
                    <a href="{{ url_for('home') }}" class="text-decoration-none d-inline-flex align-items-center mb-3">
                        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="LernyX" class="brand-logo-img me-2" width="36" height="36">
                        <span class="brand-title" style="font-size: 1.65rem;">Lerny<span class="brand-x">X</span></span>
                    </a>
                    <h1 class="fw-bold text-dark mb-1 h2 tracking-tight">Verify Your Email</h1>
                    <p class="text-secondary small mb-0">We sent a 6-digit verification code to your email. Enter it below to activate your account.</p>
                </div>

                <form method="POST" action="{{ url_for('verify_signup') }}">
                    <div class="mb-4 text-start">
                        <label for="otp" class="form-label text-dark fw-semibold small">6-Digit Verification Code</label>
                        <input type="text" class="form-control otp-input" id="otp" name="otp" required autofocus maxlength="6" pattern="\d{6}" placeholder="------" autocomplete="one-time-code">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-action">
                        Verify & Complete Signup <i class="bi bi-check-circle ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-secondary small mb-0">
                        Didn't receive the email?
                        <a href="{{ url_for('signup') }}" class="text-primary text-decoration-none fw-bold ms-1">Try Again</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
