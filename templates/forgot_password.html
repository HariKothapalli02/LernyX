{% extends "base.html" %}

{% block title %}Reset Password - LernyX{% endblock %}

{% block content %}
<style>
    /* Full-screen auth layout */
    .navbar,
    footer,
    #canvas-container {
        display: none !important;
    }

    body {
        min-height: 100vh;
        overflow-y: auto !important;
        background: #ffffff;
    }

    .split-screen {
        min-height: 100vh;
        width: 100vw;
    }

    .left-pane {
        background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        position: relative;
        border-right: 1px solid var(--border-subtle);
        min-height: 100vh;
    }

    .auth-illustration-img {
        max-width: 80%;
        max-height: 75vh;
        object-fit: contain;
        filter: drop-shadow(0 15px 35px rgba(124, 58, 237, 0.18));
    }

    .right-pane {
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 3rem 2rem;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        overflow-y: auto;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
    }

    .custom-input {
        background: #ffffff !important;
        border: 1.5px solid var(--border-slate-dark) !important;
        border-radius: var(--radius-sm) !important;
        color: var(--text-heading) !important;
        padding: 0.8rem 1.1rem;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .custom-input:focus {
        background: #ffffff !important;
        border-color: var(--primary-purple) !important;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2) !important;
        color: var(--text-heading) !important;
    }

    .custom-input::placeholder {
        color: var(--text-subtle) !important;
    }

    .btn-action {
        background: var(--primary-gradient) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: var(--radius-sm) !important;
        padding: 0.85rem;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-purple-btn);
        margin-top: 1rem;
    }

    .btn-action:hover {
        background: var(--primary-gradient-hover) !important;
        color: #ffffff !important;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    @media (max-width: 991.98px) {
        .left-pane {
            display: none !important;
        }

        .right-pane {
            width: 100%;
            padding: 2.5rem 1.5rem;
        }
    }
</style>

<div class="container-fluid p-0 split-screen">
    <div class="row g-0 h-100">
        <!-- Left Side: Illustration -->
        <div class="col-lg-7 left-pane d-none d-lg-flex">
            <img src="{{ url_for('static', filename='img/forgot-password-amico.png') }}" alt="Forgot Password Illustration" class="auth-illustration-img">
        </div>

        <!-- Right Side: Form -->
        <div class="col-lg-5 col-md-12 right-pane">
            <div class="login-container fade-in-up">
                <!-- Mobile-Only Illustration Image -->
                <div class="mobile-auth-illustration d-lg-none text-center mb-3">
                    <img src="{{ url_for('static', filename='img/forgot-password-amico.png') }}" alt="Forgot Password Illustration" class="img-fluid" style="max-height: 160px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(124, 58, 237, 0.15));">
                </div>

                <!-- Brand -->
                <div class="mb-3">
                    <a href="{{ url_for('home') }}" class="text-decoration-none d-inline-flex align-items-center">
                        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="LernyX" class="brand-logo-img me-2" width="34" height="34">
                        <span class="brand-title" style="font-size: 1.55rem;">Lerny<span class="brand-x">X</span></span>
                    </a>
                </div>

                <h1 class="fw-bold text-dark mb-2 h2 tracking-tight">Reset Password</h1>
                <p class="text-secondary small mb-4">Enter your registered email address and we will send a 6-digit OTP code to verify your identity.</p>

                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="mb-4 text-start">
                        <label for="email" class="form-label text-dark fw-semibold small">Registered Email Address</label>
                        <input type="email" class="form-control custom-input" id="email" name="email" placeholder="name@example.com" required autofocus autocomplete="email">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-action">
                        Send OTP Code <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-secondary small mb-0">
                        Remember your password?
                        <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold ms-1">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
